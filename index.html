<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Fluxo | VM Softwares</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header-banner">
        <div class="logo-area">
            <h1>VM SOFTWARES</h1>
            <h2>CONTROLE DE FLUXO - MICROEMPRESA</h2>
        </div>
    </div>

    <div class="container">
        <main class="main-content">
            <section class="form-section card">
                <h3>Registrar Nova Venda</h3>
                <form id="vendaForm">
                    <input type="hidden" id="vendaId">
                    
                    <div class="form-group">
                        <label for="clienteNome">Nome do Cliente</label>
                        <input type="text" id="clienteNome" placeholder="Ex: João da Silva" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="clienteContato">Contato (Telefone/Email)</label>
                        <input type="text" id="clienteContato" placeholder="Ex: (11) 98765-4321 ou email@exemplo.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="clienteCpf">CPF do Cliente</label>
                        <input type="text" id="clienteCpf" placeholder="Ex: 123.456.789-00" required>
                    </div>

                    <h4>Detalhes do Produto</h4>
                    
                    <div class="form-group">
                        <label for="produtoNome">Nome do Produto</label>
                        <input type="text" id="produtoNome" placeholder="Ex: Camiseta Básica" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="produtoQtd">Quantidade</label>
                        <input type="number" id="produtoQtd" placeholder="1" min="1" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="produtoValor">Valor Unitário (R$)</label>
                        <input type="number" id="produtoValor" placeholder="99.99" step="0.01" min="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="formaPagamento">Forma de Pagamento</label>
                        <select id="formaPagamento" required>
                            <option value="">Selecione...</option>
                            <option value="Débito">Débito</option>
                            <option value="Crédito">Crédito</option>
                            <option value="Pix">Pix</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Adicionar Venda</button>
                </form>
            </section>

            <section class="list-section card">
                <h3>Vendas Registradas</h3>
                <ul id="listaVendas">
                    </ul>
            </section>
        </main>
        
        <div id="modalNotaFiscal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Nota Fiscal</h2>
                <div id="notaFiscalContent">
                    </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
