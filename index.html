<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Fluxo - VM Softwares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <h1>PROJETO 1 - CONTROLE DE FLUXO</h1>
                <h2>VM Softwares</h2>
            </div>
        </header>

        <main>
            <div class="form-container">
                <h3>Registrar Nova Venda</h3>
                <form id="vendaForm">
                    <input type="hidden" id="vendaId">
                    
                    <h4>Dados do Cliente</h4>
                    <input type="text" id="clienteNome" placeholder="Nome do Cliente" required>
                    <input type="text" id="clienteContato" placeholder="Contato (Telefone/Email)" required>
                    <input type="text" id="clienteCpf" placeholder="CPF do Cliente" required>

                    <h4>Dados do Produto</h4>
                    <input type="text" id="produtoNome" placeholder="Nome do Produto" required>
                    <input type="number" id="produtoQtd" placeholder="Quantidade" min="1" required>
                    <input type="number" id="produtoValor" placeholder="Valor Unitário (R$)" step="0.01" min="0.01" required>
                    
                    <h4>Forma de Pagamento</h4>
                    <select id="formaPagamento" required>
                        <option value="">Selecione...</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                        <option value="Pix">Pix</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>

                    <button type="submit">Adicionar Venda</button>
                </form>
            </div>

            <div class="list-container">
                <h3>Vendas Registradas</h3>
                <ul id="listaVendas">
                    </ul>
            </div>
        </main>
        
        <div id="modalNotaFiscal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Nota Fiscal</h2>
                <div id="notaFiscalContent">
                    </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
